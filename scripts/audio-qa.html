<!doctype html><html lang="ja"><meta charset="utf-8"><title>Audio QA</title><style>body{font:16px system-ui;background:#142532;color:white;padding:20px}button{padding:12px;margin:5px}pre{white-space:pre-wrap}</style><h1>English Quest Audio QA</h1><button id="decode">3曲のデコード・境界を検証</button><button data-scene="town">街</button><button data-scene="battle">通常戦闘</button><button data-scene="boss">ボス</button><button id="tts">英語の読み上げ</button><button id="pause">一時停止</button><button id="resume">再開</button><button id="se">6種の効果音</button><button id="mute">消音</button><pre id="result">ユーザー操作待ち</pre><script type="module">
const {AudioManager,MUSIC}=await import(/* @vite-ignore */ '/english-quest/audio-manager.js');const a=new AudioManager(window),out=document.querySelector('#result');a.configure({sound:true});let report=[];function status(){out.textContent=JSON.stringify({report,context:a.context?.state,scene:a.scene,playing:a.musicKey,error:a.error,ducked:a.ducked,paused:a.paused,hidden:a.hidden},null,2);}document.addEventListener('visibilitychange',()=>{a.setHidden(document.hidden);status();});document.addEventListener('click',async e=>{await a.unlock();if(e.target.id==='decode'){report=[];for(const [name,d] of Object.entries(MUSIC)){try{const b=await a.load(d.file);let peak=0,power=0;const p=b.getChannelData(0);for(const x of p){peak=Math.max(peak,Math.abs(x));power+=x*x;}report.push({name,duration:b.duration,sampleRate:b.sampleRate,channels:b.numberOfChannels,loopStart:d.loopStart,loopJump:Math.abs(p.at(-1)-p[Math.round(d.loopStart*b.sampleRate)]),peak,rms:Math.sqrt(power/p.length),decoded:true});}catch(error){report.push({name,error:error.message});}}}if(e.target.dataset.scene)a.setScene(e.target.dataset.scene);if(e.target.id==='pause')a.setPaused(true);if(e.target.id==='resume')a.setPaused(false);if(e.target.id==='tts')a.speak('Protect your friends. Choose the right word.');if(e.target.id==='mute')a.configure({sound:false});if(e.target.id==='se')for(const k of ['slash','magic','heal','hit','victory','guard']){await a.effect(k);await new Promise(r=>setTimeout(r,700));}status();});setInterval(status,500);</script></html>
