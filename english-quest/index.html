<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>イングリッシュクエスト ～ことばの勇者～</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#05050f;color:#fff;font-family:'DotGothic16',monospace,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:6px;padding:6px 6px max(6px,env(safe-area-inset-bottom))}
#cv{width:100%;aspect-ratio:3/2;image-rendering:pixelated;border:3px solid #fff;border-radius:6px;background:#000;display:block;flex:none}
.win{background:linear-gradient(#1428c8,#050a60);border:3px solid #fff;border-radius:8px;box-shadow:0 0 0 2px #05083a,inset 0 0 0 2px #05083a;padding:8px 10px}
#ui{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
#msg{min-height:76px;font-size:16px;line-height:1.55;white-space:pre-wrap;position:relative;flex:none}
#msg .big{font-size:22px;letter-spacing:1px}
#msg .sub{font-size:13px;opacity:.8}
#cmds{flex:1;min-height:0;overflow:auto;display:grid;gap:2px 6px;align-content:start}
.btn{background:none;border:0;color:#fff;font:inherit;font-size:16px;padding:9px 8px 9px 22px;text-align:left;border-radius:4px;position:relative;cursor:pointer}
.btn:hover,.btn:active{background:rgba(255,255,255,.18)}
.btn:hover::before,.btn:active::before{content:'▶';position:absolute;left:6px}
.btn.dis{opacity:.4;pointer-events:none}
.spk{background:#fff;color:#0a1a9a;border:0;border-radius:6px;font:inherit;font-size:18px;padding:2px 10px;margin-left:6px;cursor:pointer}
.bar{position:absolute;left:10px;right:10px;top:4px;height:6px;background:#000;border:1px solid #fff}
.bar>i{display:block;height:100%;background:#4f4;width:100%}
#fieldUI{display:none;flex:1;align-items:center;justify-content:space-between;padding:0 6px;gap:8px}
#dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,52px);gap:3px}
#dpad button,#fbtns button{background:linear-gradient(#1428c8,#050a60);border:3px solid #fff;border-radius:10px;color:#fff;font:inherit;font-size:20px}
#dpad button:active,#fbtns button:active{background:#38f}
#dpad .u{grid-column:2;grid-row:1}#dpad .l{grid-column:1;grid-row:2}#dpad .r{grid-column:3;grid-row:2}#dpad .d{grid-column:2;grid-row:3}
#fbtns{display:flex;flex-direction:column;gap:8px;flex:1;max-width:200px}
#fbtns button{font-size:15px;padding:12px 6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:14px;z-index:9}
#modal .win{width:min(520px,100%);max-height:88vh;overflow:auto;font-size:15px;line-height:1.6}
#modal h3{margin:0 0 6px;font-size:18px;font-weight:normal;border-bottom:2px solid #fff;padding-bottom:4px}
#modal table{width:100%;border-collapse:collapse;font-size:14px}
#modal td{padding:2px 4px;border-bottom:1px dotted #668}
#modal .tag{display:inline-block;background:#fff;color:#0a1a9a;border-radius:4px;padding:0 6px;margin-right:4px;font-size:12px}
input.sp{width:100%;font:inherit;font-size:22px;padding:8px;border:3px solid #fff;border-radius:6px;background:#000;color:#fff;letter-spacing:2px;grid-column:1/-1}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="384" height="256"></canvas>
  <div id="ui">
    <div id="msg" class="win"></div>
    <div id="cmds" class="win"></div>
    <div id="fieldUI">
      <div id="dpad">
        <button class="u" data-d="up">▲</button><button class="l" data-d="left">◀</button>
        <button class="r" data-d="right">▶</button><button class="d" data-d="down">▼</button>
      </div>
      <div id="fbtns">
        <button id="bStatus">つよさ</button>
        <button id="bBook">ことばノート</button>
        <button id="bSnd">♪ BGM: ON</button>
      </div>
    </div>
  </div>
</div>
<div id="modal"><div class="win" id="modalBody"></div></div>

  dragon: ["..k........k....", ".kgk......kgk...", ".kgkkkkkkkkgk...", "..kgggggggggk...", ".kgggyggggyggk..", ".kgggkgggkgggk..", ".kggggggggggggk.", "..kgwgwgwgwggk..", "...kgggggggggk..", "..kgggbbbbbgggk.", "..kgggbbbbbgggk.", "..kggggbbbggggk.", "...kgggkkkgggk..", "..kggkk...kkggk.", "..kkk.......kkk."]
};
const ENEMIES = [
  [ // zone 0 そうげん
    { name: 'スライム', spr: 'slime', pal: { k: '#111', w: '#fff', b: '#3a8cff' }, hp: 22, atk: 5, exp: 10, gold: 5, tiers: [1] },

    { name: 'おおコウモリ', spr: 'bat', pal: { k: '#111', w: '#fff', p: '#3a9a5a', r: '#ff0' }, hp: 50, atk: 11, exp: 25, gold: 12, tiers: [2] }],
  [ // zone 2 やみのだいち

];

const spriteCache = {};
function enemySprite(def, white) {
  const key = def.name + (white ? '#w' : '');
  if (!spriteCache[key]) spriteCache[key] = spriteCanvas(SPR[def.spr], def.pal, def.boss ? 9 : 8, false, white ? '#fff' : null);

/* ---------------------------------------------------------------- マップ */
const MW = 48, MH = 40, START = [6, 34];
const TOWNS = [{ x: 6, y: 33, name: 'ハロータウン' }, { x: 24, y: 20, name: 'ワードの村' }];
const CASTLE = { x: 42, y: 5, name: 'ドラゴン城' };
const ZONE_NAMES = ['そうげん', 'まよいの もり', 'やみの だいち'];
function hash2(x, y) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263); h = Math.imul(h ^ h >>> 13, 1274126177); return ((h ^ h >>> 16) >>> 0) / 4294967296; }
function vnoise(x, y) {

  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1), u = s(xf), v = s(yf);

function zoneAt(x, y) { const d = Math.hypot(x - START[0], y - START[1]); return d < 16 ? 0 : d < 34 ? 1 : 2; }
const MAP = [];
function genMap() {
  for (let y = 0; y < MH; y++) { MAP[y] = []; for (let x = 0; x < MW; x++) {
    const n = 0.6 * vnoise(x * .1 + 100, y * .1 + 100) + 0.3 * vnoise(x * .22 + 50, y * .22 + 50) + 0.1 * vnoise(x * .5, y * .5);
    let t = 0;
    if (n < 0.40) t = 2; else if (n > 0.64) t = 4;
    else { const z = zoneAt(x, y), tn = vnoise(x * .3 + 7, y * .3 + 9); if (tn > [0.68, 0.56, 0.6][z]) t = 1; else if (hash2(x, y) < .05) t = 7; }
    if (x < 1 || y < 1 || x >= MW - 1 || y >= MH - 1) t = 1;
    MAP[y][x] = t;
  } }
  const set = (x, y, t) => { if (x > 0 && y > 0 && x < MW - 1 && y < MH - 1) MAP[y][x] = t; };
  const clear = (cx, cy, r) => { for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) set(cx + x, cy + y, 0); };
  [[...START], ...TOWNS.map(t => [t.x, t.y]), [CASTLE.x, CASTLE.y]].forEach(p => clear(p[0], p[1], 2));
  let seed = 7; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const carve = (a, b) => {
    let [x, y] = a;
    for (let guard = 0; guard < 400 && (x !== b[0] || y !== b[1]); guard++) {
      set(x, y, 3);

    }

  };
  const way = [START, [14, 30], [19, 25], [TOWNS[1].x, TOWNS[1].y + 1], [30, 15], [37, 9], [CASTLE.x, CASTLE.y + 1]];
  for (let i = 0; i < way.length - 1; i++) carve(way[i], way[i + 1]);
  carve(START, [TOWNS[0].x, TOWNS[0].y + 1]);

const WALK = new Set([0, 3, 5, 6, 7]);

/* タイル描画 (16x16) をキャッシュ */
const ZP = [
  { g1: '#5cbc4c', g2: '#48a23c', g3: '#7ad468', tr: '#2c7a30', tr2: '#1f5a24', w1: '#2f6fe0', w2: '#5a95ff', p1: '#d9b878', p2: '#b89858', mt: '#8a8a98' },
  { g1: '#3f9a54', g2: '#2d7c40', g3: '#58b46a', tr: '#1c5a2c', tr2: '#123e1e', w1: '#2a5ccc', w2: '#4a85ee', p1: '#c9a868', p2: '#a98848', mt: '#7a7a88' },
  { g1: '#7a62a4', g2: '#604a88', g3: '#957cc0', tr: '#3a2a4e', tr2: '#241838', w1: '#5a2a7a', w2: '#8a4aa8', p1: '#9a8a8a', p2: '#7a6a6a', mt: '#5a4a62' }

const tileCache = {};
function tileCanvas(t, z, v, f) {

  bgm('town');
  await say('ワードドラゴンは ひかりに つつまれ きえていった…');
  await say('ゆうしゃが おぼえた ことばは せかいじゅうの ひとびとを つなぐ ちからと なった。');
  await say(`★ ゲームクリア! おめでとう! ★\nおぼえた ことば: ${Object.keys(S.words).length}こ\nこれからも ぼうけんを つづけて ことばを みがこう!`, 800);
}

/* ---------------------------------------------------------------- フィールド */
function placePlayer() { P.x = S.x; P.y = S.y; P.px = P.x * TS; P.py = P.y * TS; P.moving = false; }
function tryMove(dir) {
  const d = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[dir]; P.dir = dir;
  const nx = P.x + d[0], ny = P.y + d[1];
  if (nx < 0 || ny < 0 || nx >= MW || ny >= MH || !WALK.has(MAP[ny][nx])) return;
  P.moving = true; P.t = 0; P.fx = P.x * TS; P.fy = P.y * TS; P.tx = nx; P.ty = ny;
}
async function arrive() {
  P.x = P.tx; P.y = P.ty; P.px = P.x * TS; P.py = P.y * TS; P.moving = false; S.x = P.x; S.y = P.y; sfx('step');
  const t = MAP[P.y][P.x];
  if (t === 5) { busy = true; setUI('battle'); const i = TOWNS.findIndex(q => q.x === P.x && q.y === P.y); await town(TOWNS[i], i); return; }
  if (t === 6) { busy = true; setUI('battle'); await castle(); return; }
  const z = zoneAt(P.x, P.y);
  if (z !== lastZone) { lastZone = z; bannerText = ZONE_NAMES[z]; bannerT = 2.2; }
  if (Math.random() < (t === 3 ? .045 : .095)) {
    busy = true; setUI('battle');
    let list = ENEMIES[z].filter(e => !e.rare || Math.random() < .12); await battle(pick(list), z);
  }
}
function update(dt) {
  time += dt;
  if (shake > 0) shake = Math.max(0, shake - dt); if (redFlash > 0) redFlash = Math.max(0, redFlash - dt);
  if (bannerT > 0) bannerT -= dt;
  if (mode === 'field' && !busy) {
    if (P.moving) {
      P.t += dt / .16;
      if (P.t >= 1) { arrive(); } else { P.px = P.fx + (P.tx * TS - P.fx) * P.t; P.py = P.fy + (P.ty * TS - P.fy) * P.t; }
    } else if (input.dir) tryMove(input.dir);
  }
  if (B) {
    B.e.bob = Math.sin(time * 3) * 3;
    B.floats.forEach(f => { f.t += dt; f.y -= dt * 28; }); B.floats = B.floats.filter(f => f.t < 1);
    B.parts.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 220 * dt; }); B.parts = B.parts.filter(p => p.t < p.life);
  }
}

/* ---------------------------------------------------------------- 描画 */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function win(x, y, w, h) {
  ctx.fillStyle = '#fff'; rr(x, y, w, h, 5); ctx.fill();
  const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, '#1428c8'); g.addColorStop(1, '#050a60');
  ctx.fillStyle = g; rr(x + 2, y + 2, w - 4, h - 4, 4); ctx.fill();
}
function text(t, x, y, size = 12, color = '#fff', align = 'left') {
  ctx.font = `${size}px 'DotGothic16',monospace`; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(t, x + 1, y + 1); ctx.fillStyle = color; ctx.fillText(t, x, y);
}
function drawStatus(x, y) {
  win(x, y, 96, 58); text('ゆうしゃ', x + 8, y + 5, 11, '#ff8'); text(`Lv ${S.lv}`, x + 8, y + 18, 11);
  text(`HP ${S.hp}/${maxHpOf(S.lv)}`, x + 8, y + 30, 11, S.hp < maxHpOf(S.lv) * .3 ? '#f88' : '#fff'); text(`MP ${S.mp}/${maxMpOf(S.lv)}`, x + 8, y + 42, 11, '#8cf');
}
function drawField() {
  const camX = clamp(P.px + 8 - W / 2, 0, MW * TS - W), camY = clamp(P.py + 8 - H / 2, 0, MH * TS - H);
  const sx = Math.floor(camX / TS), sy = Math.floor(camY / TS), fr = Math.floor(time * 2) % 2;
  for (let y = sy; y <= sy + VH; y++) for (let x = sx; x <= sx + VW; x++) {
    if (x < 0 || y < 0 || x >= MW || y >= MH) continue; const t = MAP[y][x], z = zoneAt(x, y), v = (hash2(x, y) * 3) | 0;
    ctx.drawImage(tileCanvas(t === 5 || t === 6 || t === 1 || t === 4 || t === 7 ? t : t, z, v, t === 2 ? fr : 0), Math.floor(x * TS - camX), Math.floor(y * TS - camY));
  }
  const hx = Math.floor(P.px - camX), hy = Math.floor(P.py - camY);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(hx + 8, hy + 15, 6, 2.5, 0, 0, 7); ctx.fill();
  const fi = P.moving ? (P.t < .5 ? 1 : 2) : 0;
  ctx.drawImage(HERO[P.dir][fi], hx, hy - (P.moving && P.t > .25 && P.t < .75 ? 1 : 0));
  // 雲のかげ
  ctx.fillStyle = 'rgba(0,0,30,.10)';
  for (let i = 0; i < 4; i++) { const cx = ((i * 190 + time * 9) % (W + 160)) - 80, cy = 40 + i * 62 + Math.sin(time * .3 + i) * 6; ctx.beginPath(); ctx.ellipse(cx, cy, 46, 14, 0, 0, 7); ctx.fill(); }
  const z = zoneAt(P.x, P.y); if (z === 2) { ctx.fillStyle = 'rgba(40,0,60,.18)'; ctx.fillRect(0, 0, W, H); }
  drawStatus(4, 4); text(`${S.gold}G`, 8, 66, 11, '#fe8');
  if (bannerT > 0) { const a = Math.min(1, bannerT, 2.2 - bannerT + .2); ctx.globalAlpha = clamp(a, 0, 1); win(W / 2 - 80, 92, 160, 30); text(bannerText, W / 2, 99, 15, '#fff', 'center'); ctx.globalAlpha = 1; }
}
function drawBattle() {
  const z = B.zone, e = B.e;
  const sky = [['#7ec8ff', '#d6f0ff'], ['#2c6a58', '#9ad8a0'], ['#2a0f45', '#8a3a7a'], ['#2a0505', '#b0301c']][z];
  let g = ctx.createLinearGradient(0, 0, 0, 150); g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 150);
  // 星/太陽
  if (z >= 2) { ctx.fillStyle = '#fff'; for (let i = 0; i < 30; i++) { if ((i + Math.floor(time * 3)) % 7) ctx.fillRect(hash2(i, 1) * W, hash2(i, 2) * 90, 1.5, 1.5); } ctx.fillStyle = z === 3 ? '#ff6' : '#eee'; ctx.beginPath(); ctx.arc(310, 40, 17, 0, 7); ctx.fill(); }
  else { ctx.fillStyle = '#fff6'; for (let i = 0; i < 3; i++) { const cx = ((i * 150 + time * 10) % (W + 120)) - 60; ctx.beginPath(); ctx.ellipse(cx, 30 + i * 18, 34, 9, 0, 0, 7); ctx.ellipse(cx + 20, 24 + i * 18, 22, 8, 0, 0, 7); ctx.fill(); } }
  // やま (パララックス)
  const mt = [['#5a8a9a', '#3a6a7a'], ['#1a4a3a', '#0e3326'], ['#3a1a5a', '#240e3a'], ['#5a1010', '#3a0808']][z];
  [[0.15, 100, mt[0]], [0.35, 118, mt[1]]].forEach(([sp, base, col]) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 150); for (let x = 0; x <= W + 20; x += 20) ctx.lineTo(x, base - Math.abs(Math.sin((x + time * 6 * sp * 10) * .03 + sp * 9)) * 40 - sp * 20); ctx.lineTo(W, 150); ctx.fill(); });
  // ゆか
  const gr = [['#4aa23e', '#3a8830'], ['#2d7c40', '#1f6030'], ['#604a88', '#483468'], ['#601410', '#401008']][z];
  ctx.fillStyle = gr[0]; ctx.fillRect(0, 150, W, 106);
  for (let i = 0; i < 9; i++) { ctx.fillStyle = gr[1]; const y = 150 + i * i * 1.6; ctx.fillRect(0, y, W, 2 + i * .4); }
  if (z === 3) { ctx.fillStyle = '#f80'; for (let i = 0; i < 12; i++) ctx.fillRect(hash2(i, 5) * W + Math.sin(time * 2 + i) * 4, 160 + hash2(i, 6) * 90, 3, 2); }
  // 敵
  const cx = W / 2, cy = 120; const spr = enemySprite(e.def), sw = spr.width, sh = spr.height;
  ctx.globalAlpha = e.alpha; ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(cx, cy + sh / 2 + 8, sw / 2.4, 8, 0, 0, 7); ctx.fill();
  const flick = B.fx && B.fx.t === 'slash' && B.fx.p > .5 && Math.floor(B.fx.p * 20) % 2;
  ctx.drawImage(flick ? enemySprite(e.def, true) : spr, cx - sw / 2 + e.ox, cy - sh / 2 + e.bob + e.oy);
  ctx.globalAlpha = 1;
  // HPバー
  if (e.alpha > 0) { const bw = 100; ctx.fillStyle = '#000'; ctx.fillRect(cx - bw / 2 - 1, 188, bw + 2, 8); ctx.fillStyle = '#fff'; ctx.fillRect(cx - bw / 2, 189, bw, 6); ctx.fillStyle = e.hp / e.max < .3 ? '#e44' : '#3d3'; ctx.fillRect(cx - bw / 2, 189, bw * e.hp / e.max, 6); text(e.def.name, cx, 198, 12, '#fff', 'center'); }
  // エフェクト
  if (B.fx) {
    if (B.fx.t === 'slash') { const p = B.fx.p; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round'; for (let k = 0; k < 3; k++) { const o = k * 10 - 10, a = clamp(p * 1.6 - k * .15, 0, 1); ctx.globalAlpha = 1 - Math.abs(a - .5) * 1.6; ctx.beginPath(); ctx.moveTo(cx - 55 + o, 60 + k * 4); ctx.lineTo(cx - 55 + o + a * 110, 60 + k * 4 + a * 110); ctx.stroke(); } ctx.globalAlpha = 1; }
    if (B.fx.t === 'fire') { const p = B.fx.p; for (let i = 0; i < 14; i++) { const a = i / 14 * 6.28 + p * 4, r = 20 + p * 50; ctx.fillStyle = ['#f60', '#ff0', '#f33'][i % 3]; ctx.globalAlpha = 1 - p * .7; ctx.beginPath(); ctx.arc(cx + Math.cos(a) * r * .8, 120 + Math.sin(a) * r * .8 - p * 20, 10 - p * 5, 0, 7); ctx.fill(); } ctx.globalAlpha = 1; }
  }
  B.parts.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = 1 - p.t / p.life; ctx.fillRect(p.x, p.y, 3, 3); }); ctx.globalAlpha = 1;
  B.floats.forEach(f => text(f.text, f.x, f.y, 22, f.color, 'center'));
  drawStatus(4, 4); if (B.combo >= 2) text(`${B.combo} COMBO!`, W - 8, 8, 14, '#ff6', 'right');
}
function drawTitle() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#05052a'); g.addColorStop(.7, '#3a2a7a'); g.addColorStop(1, '#8a4a8a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; for (let i = 0; i < 60; i++) if ((i + Math.floor(time * 2 + hash2(i, 0) * 5)) % 4) ctx.fillRect(hash2(i, 3) * W, hash2(i, 4) * 170, 1.5, 1.5);
  ctx.fillStyle = '#10062a'; ctx.beginPath(); ctx.moveTo(0, H); for (let x = 0; x <= W; x += 16) ctx.lineTo(x, 200 - Math.abs(Math.sin(x * .04)) * 30); ctx.lineTo(W, H); ctx.fill();
  // 城のシルエット
  ctx.fillStyle = '#0a0418'; ctx.fillRect(150, 150, 84, 70); ctx.fillRect(140, 130, 20, 90); ctx.fillRect(224, 130, 20, 90); ctx.fillRect(176, 118, 32, 40);
  ctx.fillStyle = '#ff8'; [[146, 150], [230, 150], [186, 130], [192, 190]].forEach(([x, y]) => ctx.fillRect(x, y, 3, 5));
  const sp = HERO.down[Math.floor(time * 2) % 2 ? 1 : 0]; ctx.drawImage(sp, 0, 0, 16, 16, 184, 222 + Math.sin(time * 4), 16, 16);
  const bob = Math.sin(time * 2) * 3;
  text('ENGLISH', W / 2, 24 + bob, 40, '#ffd84a', 'center'); text('QUEST', W / 2, 62 + bob, 40, '#ffd84a', 'center');
  text('～ ことばの ゆうしゃ ～', W / 2, 108, 16, '#fff', 'center');
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-4, 4), rnd(-3, 3));
  if (mode === 'title') drawTitle(); else if (mode === 'battle' && B) drawBattle(); else if (mode === 'field') drawField();
  else if (mode === 'trans') { if (B) drawBattle(); else drawField(); }
  ctx.restore();
  if (redFlash > 0) { ctx.fillStyle = `rgba(255,0,0,${redFlash})`; ctx.fillRect(0, 0, W, H); }
  if (TR.white) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); }
  if (TR.p > 0) { ctx.fillStyle = '#000'; const n = 12, bw = W / n; for (let i = 0; i < n; i++) { const h = H * TR.p; if (i % 2) ctx.fillRect(i * bw, 0, bw + 1, h); else ctx.fillRect(i * bw, H - h, bw + 1, h); } }
}
let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(loop); }

/* ---------------------------------------------------------------- 入力・メニュー */
const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
const held = [];
addEventListener('keydown', e => { const d = KEYS[e.key]; if (d && e.target.tagName !== 'INPUT') { e.preventDefault(); if (!held.includes(d)) held.push(d); input.dir = d; } });
addEventListener('keyup', e => { const d = KEYS[e.key]; if (d) { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); input.dir = held[held.length - 1] || null; } });
document.querySelectorAll('#dpad button').forEach(b => {
  const on = e => { e.preventDefault(); ac(); input.dir = b.dataset.d; }, off = e => { e.preventDefault(); if (input.dir === b.dataset.d) input.dir = null; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
});
$('#bSnd').onclick = () => { muted = !muted; $('#bSnd').textContent = '♪ BGM: ' + (muted ? 'OFF' : 'ON'); if (muted) { bgmTok++; bgmName = null; } else bgm(mode === 'battle' ? 'battle' : 'field'); };
$('#bStatus').onclick = async () => {
  if (busy) return; busy = true; const known = Object.keys(S.words).length, tot = S.ok + S.ng;
  await modal(`<h3>ゆうしゃの つよさ</h3>Lv ${S.lv}　EXP ${S.exp}/${needOf(S.lv)}<br>HP ${S.hp}/${maxHpOf(S.lv)}　MP ${S.mp}/${maxMpOf(S.lv)}<br>こうげき ${atkOf(S.lv)}　${S.gold}G　やくそう ${S.herbs}こ<br>たおした てき ${S.wins}ひき　さいこう ${S.best}コンボ<br>であった ことば ${known}こ　せいかいりつ ${tot ? Math.round(S.ok / tot * 100) : 0}%<br>${S.cleared ? '★ ワードドラゴンを たおした!' : 'もくひょう: Lv8 でドラゴンじょう(右上)へ'}`);
  busy = false;
};
$('#bBook').onclick = async () => {
  if (busy) return; busy = true; const all = POOL.slice(1).flat();
  const rows = all.filter(w => S.words[w.en]).sort((a, b) => ((S.words[b.en].n - S.words[b.en].o) - (S.words[a.en].n - S.words[a.en].o)));
  const weak = rows.filter(w => S.words[w.en].n > S.words[w.en].o);
  const tr = w => `<tr><td>${esc(w.en)}</td><td>${esc(w.ja)}</td><td>⭕${S.words[w.en].o} ❌${S.words[w.en].n}</td></tr>`;
  await modal(`<h3>ことばノート</h3>であった ことば: ${rows.length} / ${all.length}<br>${weak.length ? `<div class="tag" style="margin-top:6px">にがて</div> もっと でやすく なります<table>${weak.slice(0, 12).map(tr).join('')}</table>` : ''}<div class="tag" style="margin-top:8px">ぜんぶ</div>${rows.length ? `<table>${rows.slice(0, 80).map(tr).join('')}</table>` : '<br>まだ ありません。てきと たたかおう!'}`);
  busy = false;
};
function titleMenu() {
  mode = 'title'; setUI('battle'); msgEl.innerHTML = '<div class="big">イングリッシュクエスト</div><div class="sub">てきと たたかいながら えいごを まなぼう!\nこたえを えらんで こうげき。スペルを うてば まほうだ!</div>'; msgEl.onclick = null;
  const saved = load();
  const opts = saved ? [`つづきから (Lv${saved.lv})`, 'はじめから'] : ['ぼうけんを はじめる'];
  choose(opts).then(async c => {
    ac(); if (canSpeak) speechSynthesis.getVoices();
    if (saved && c === 0) S = saved; else S = newSave();
    genMap(); placePlayer(); save();
    if (!saved || c === 1) { await say('むかしむかし、ことばの ちからで せかいは つながっていた。\nしかし ワードドラゴンが ことばを うばい、せかいは ばらばらに…'); await say('ゆうしゃよ、えいごの ちからを あつめ、\nみぎうえの ドラゴンじょうを めざすのじゃ!\n(Lv8 になったら ちょうせんだ)'); }
    mode = 'trans'; await tween(400, p => TR.p = p); mode = 'field'; setUI('field'); bgm('field'); lastZone = -1; await tween(400, p => TR.p = 1 - p); TR.p = 0; busy = false;
    bannerText = ZONE_NAMES[zoneAt(P.x, P.y)]; bannerT = 2.2; lastZone = zoneAt(P.x, P.y);
  });
}
buildHero(); genMap(); S = newSave(); placePlayer(); setUI('battle'); titleMenu(); requestAnimationFrame(loop);
window.__eq = { get S() { return S; }, battle, ENEMIES, BOSS, get mode() { return mode; } };
</script>
