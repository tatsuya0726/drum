<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>イングリッシュクエスト ～ことばの勇者～</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:'DotGothic16',monospace,sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:6px;padding:0 0 max(6px,env(safe-area-inset-bottom));--s:1.6}
#stage{position:relative;width:100%;aspect-ratio:256/224;flex:none;background:#000;overflow:hidden}
#cv{width:100%;height:100%;display:block;image-rendering:pixelated}
/* ドラクエ風ウィンドウ: 濃紺 + 白い二重ふち */
.win{background:#00007c;background:linear-gradient(#0a0a96,#000066);border:calc(var(--s)*2px) solid #f4f4f4;border-radius:calc(var(--s)*5px);box-shadow:0 0 0 calc(var(--s)*1px) #1a1a50,inset 0 0 0 calc(var(--s)*1px) #3838b8;padding:calc(var(--s)*6px) calc(var(--s)*8px)}
#msg{position:absolute;left:2.4%;right:2.4%;bottom:3%;min-height:27%;font-size:calc(var(--s)*11.5px);line-height:1.5;white-space:pre-wrap;letter-spacing:.04em;text-shadow:calc(var(--s)*1px) calc(var(--s)*1px) 0 #000}
#msg .big{font-size:1.45em}
#msg .sub{font-size:.85em;opacity:.85}
#msg .more{position:absolute;right:calc(var(--s)*10px);bottom:calc(var(--s)*4px);animation:bl .7s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#cmds{flex:1;min-height:0;overflow:auto;display:grid;gap:2px 6px;align-content:start;margin:0 6px;--s:1.6}
.btn{background:none;border:0;color:#fff;font:inherit;font-size:16px;padding:9px 8px 9px 24px;text-align:left;border-radius:4px;position:relative;cursor:pointer}
.btn:hover,.btn:active{background:rgba(255,255,255,.18)}
.btn:hover::before,.btn:active::before{content:'▶';position:absolute;left:6px}
.btn.dis{opacity:.4;pointer-events:none}
.spk{background:#f4f4f4;color:#00007c;border:0;border-radius:6px;font:inherit;font-size:.9em;padding:0 8px;margin-left:6px;cursor:pointer}
.bar{position:absolute;left:calc(var(--s)*8px);right:calc(var(--s)*8px);top:calc(var(--s)*3px);height:calc(var(--s)*4px);background:#000;border:1px solid #fff}
.bar>i{display:block;height:100%;background:#4f4;width:100%}
#fieldUI{display:none;flex:1;align-items:center;justify-content:space-between;padding:0 10px;gap:8px}
#dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,50px);gap:3px}
#dpad button,#fbtns button,#bA{background:linear-gradient(#0a0a96,#000066);border:3px solid #f4f4f4;border-radius:10px;color:#fff;font:inherit;font-size:20px}
#dpad button:active,#fbtns button:active,#bA:active{background:#38f}
#dpad .u{grid-column:2;grid-row:1}#dpad .l{grid-column:1;grid-row:2}#dpad .r{grid-column:3;grid-row:2}#dpad .d{grid-column:2;grid-row:3}
#fbtns{display:flex;flex-direction:column;gap:7px;flex:1;max-width:190px}
#fbtns button{font-size:14px;padding:9px 6px}
#bA{height:64px;font-size:20px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:14px;z-index:9;--s:1.6}
#modal .win{width:min(520px,100%);max-height:88vh;overflow:auto;font-size:15px;line-height:1.6}
#modal h3{margin:0 0 6px;font-size:18px;font-weight:normal;border-bottom:2px solid #fff;padding-bottom:4px}
#modal table{width:100%;border-collapse:collapse;font-size:14px}
#modal td{padding:2px 4px;border-bottom:1px dotted #668}
#modal .tag{display:inline-block;background:#fff;color:#00007c;border-radius:4px;padding:0 6px;margin-right:4px;font-size:12px}
input.sp{width:100%;font:inherit;font-size:22px;padding:8px;border:3px solid #fff;border-radius:6px;background:#000;color:#fff;letter-spacing:2px;grid-column:1/-1}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="cv" width="256" height="224"></canvas>
    <div id="msg" class="win"></div>
  </div>
  <div id="cmds" class="win"></div>
  <div id="fieldUI">
    <div id="dpad">
      <button class="u" data-d="up">▲</button><button class="l" data-d="left">◀</button>
      <button class="r" data-d="right">▶</button><button class="d" data-d="down">▼</button>
    </div>
    <div id="fbtns">
      <button id="bA">はなす / しらべる</button>
      <button id="bStatus">つよさ</button>
      <button id="bBook">ことばノート</button>
      <button id="bSnd">♪ BGM: ON</button>
    </div>
  </div>
</div>
<div id="modal"><div class="win" id="modalBody"></div></div>

<script>
'use strict';
/* =====================================================================

const $ = s => document.querySelector(s);

const PHRASES = `How are you?|お元気ですか?;Nice to meet you.|はじめまして。;Thank you very much.|どうもありがとう。;I'm looking for my key.|かぎを探しています。;Could you help me?|手伝っていただけますか?;What time is it?|何時ですか?;I have no idea.|さっぱりわかりません。;Let's go together.|いっしょに行こう。;Don't give up!|あきらめるな!;It's up to you.|あなた次第です。;I'm used to it.|慣れています。;How much is this?|これはいくらですか?;See you tomorrow.|また明日。;I'll do my best.|全力をつくします。;Where is the station?|駅はどこですか?;Take care of yourself.|お大事に。;I'm afraid I can't.|残念ながらできません。;It's a piece of cake.|朝飯前だよ。`;
const parse = (s, tier) => s.split(';').map(p => { const [en, ja] = p.split('|'); return { en, ja, tier }; });

/* =====================================================================

   ===================================================================== */
const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];

/* まわりに 1px のふちどり (となりの色を暗くした色 = SFCの選択的アウトライン) */
function outline(c, dark = .3, fixed = null) {
  const w = c.width + 2, h = c.height + 2;
  const o = art(w, h, g => g.drawImage(c, 1, 1)); const g2 = o.getContext('2d'), id = g2.getImageData(0, 0, w, h), s = id.data, src = new Uint8ClampedArray(s);

  }

}
function whiteOf(c) { return art(c.width, c.height, g => { g.drawImage(c, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }); }

/* ---------------------------------------------------------------- キャラ (14x22 → ふちどりで16x24) */
const F_TOP = ["..H...HH...H..", ".HHH.HhhH.HHH.", ".HHHHHhhHHHHH.", "HHHhHHHHHHhHHH", "HHHHHHHHHHHHHH", ".HHsssssssSHH.", ".HssesssssesH.", "..sssssssssS..", "..ssssmmssss..", "...wwwwwwwwW..", "..rrrrwwrrrrR.", ".ssrrrrrrrrrss", ".ssrrrrrrrrRss", "..rrrrrrrrrR..", "..yyyyyyyyyy.."];
const F_LEG0 = ["..pppppppppP..", "..ppppppPppp..", "..pppp..pppp..", "..pppp..pppp..", "..bbbb..bbbb..", "..bbbb..bbbb..", ".bbbbb..bbbbb."];
const F_LEG1 = ["..pppppppppP..", "..ppppppPppp..", "..pppp...ppp..", "..pppp...ppp..", "..bbbb...bbb..", ".bbbbb........", ".............."];
const B_TOP = F_TOP.map((r, i) => i === 5 || i === 6 ? ".HHHHHHHHHHHH." : i === 7 ? "..HHHHHHHHHd.." : i === 8 ? "..HHHHHHHHdd.." : i === 9 ? "...HHHHHHHHd.." : i >= 10 && i <= 13 ? r.replace(/w/g, 'r') : r);
const S_TOP = ["...H..HH.H....", "..HHHHhhHHH...", ".HHHHHHhHHHH..", ".HHHHHHHHHHHs.", ".HHHHHHHsssss.", ".HHHHHHsesssS.", "..HHHHHsssssS.", "...HHHHssssmS.", "....HHsssssS..", "....wwwwwwW...", "....rrrwrrrR..", "....rrrrrrsrR.", "....rrrrrrssR.", "....rrrrrrrR..", "....yyyyyyyy.."];
const S_LEG0 = ["....pppppppP..", "....pppppppP..", "....pppppppP..", "....pppppppP..", "....bbbbbbbb..", "....bbbbbbbbb.", ".............."];
const S_LEG1 = ["....pppppppP..", "...pppp.pppP..", "..pppp...pppP.", "..pppp....ppP.", "..bbbb....bbb.", ".bbbbb....bbbb", ".............."];
const CHARS = {
  hero: { H: '#3a62dc', h: '#86aaff', d: '#1c3490', s: '#f8c8a0', S: '#d49878', e: '#202030', m: '#b0604a', r: '#d83a2a', R: '#962016', y: '#f8d848', w: '#ffffff', W: '#b0b8d8', p: '#4a3a82', P: '#2c2058', b: '#6a4020' },
  girl: { H: '#a8602c', h: '#d89050', d: '#703c18', s: '#f8c8a0', S: '#d49878', e: '#202030', m: '#c06060', r: '#e86ca8', R: '#a83c78', y: '#f8f0a0', w: '#ffffff', W: '#d0b8d0', p: '#e86ca8', P: '#a83c78', b: '#8a4a2a' },
  keeper: { H: '#c89848', h: '#f0c878', d: '#8a6428', s: '#f8c8a0', S: '#d49878', e: '#202030', m: '#b0604a', r: '#4aa860', R: '#2a7038', y: '#f8d848', w: '#f8f0d8', W: '#c0b898', p: '#7a5a3a', P: '#523a22', b: '#4a3018' },
  elder: { H: '#eeeeee', h: '#ffffff', d: '#b8b8c8', s: '#f0c098', S: '#c89070', e: '#202030', m: '#a05040', r: '#8a4ab8', R: '#582c80', y: '#f8d848', w: '#eeeeee', W: '#b0b0c0', p: '#5a3a78', P: '#3a2450', b: '#4a3018' },
  kid: { H: '#e8a020', h: '#ffd868', d: '#a06810', s: '#f8c8a0', S: '#d49878', e: '#202030', m: '#b0604a', r: '#38a8e8', R: '#2070a8', y: '#fff', w: '#ffffff', W: '#b0c8e0', p: '#386888', P: '#244860', b: '#6a4020' },
  granny: { H: '#e0e0ee', h: '#ffffff', d: '#a8a8c0', s: '#f0c098', S: '#c89070', e: '#202030', m: '#a05040', r: '#8a6ab8', R: '#5a3c88', y: '#f8d848', w: '#fff0f0', W: '#c8b8c8', p: '#8a6ab8', P: '#5a3c88', b: '#6a4020' },
  farmer: { H: '#8a5a2c', h: '#b88040', d: '#583818', s: '#f0b890', S: '#c88860', e: '#202030', m: '#a05040', r: '#c8a040', R: '#8a6a20', y: '#a05030', w: '#f0e8d0', W: '#c0b890', p: '#5a6a8a', P: '#384868', b: '#4a3018' },
  guard: { H: '#8890a8', h: '#d0d8e8', d: '#505870', s: '#f0b890', S: '#c88860', e: '#202030', m: '#a05040', r: '#9aa4b8', R: '#5a6478', y: '#f8d848', w: '#c8d0e0', W: '#8890a8', p: '#4a5468', P: '#2c3444', b: '#3a3a44' }

const charCache = {};
const ed = (rows, list) => { const r = [...rows]; list.forEach(([i, c, str]) => { r[i] = r[i].slice(0, c) + str + r[i].slice(c + str.length); }); return r; };
function variantRows(name, view) {
  let top = view === 'f' ? F_TOP : view === 'b' ? B_TOP : S_TOP, leg0 = view === 's' ? S_LEG0 : F_LEG0, leg1 = view === 's' ? S_LEG1 : F_LEG1;

  if (name === 'keeper' || name === 'farmer') top = f ? ed(top, [[11, 4, 'wwwwww'], [12, 4, 'wwwwww'], [13, 4, 'wwwwww']]) : s_ap(top, view);
  if (name === 'elder') top = f ? ed(top, [[8, 2, 'sswwwwwwss'], [9, 3, 'wwwwwwww']]) : view === 's' ? ed(top, [[8, 7, 'wwww']]) : top;
  if (name === 'guard') top = ed(top, f || b ? [[0, 0, '......yy......'], [1, 0, '.HHH.HhhH.HHH.']] : [[0, 0, '....yy........']]);

  return [top, leg0, leg1];
}
const s_ap = (top, view) => view === 's' ? ed(top, [[11, 6, 'wwww'], [12, 6, 'wwww'], [13, 6, 'wwww']]) : top;
function charFrames(name) {

function weightOf(w) { const r = S.words[w.en]; if (!r) return 1.6; if (r.n > r.o) return 4; if (r.o >= 3 && r.o > r.n * 2) return .5; return 1.2; }
function roulette(list) { const ws = list.map(weightOf), sum = ws.reduce((a, b) => a + b, 0); let r = Math.random() * sum; for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; } return list[0]; }
const pickWord = tiers => roulette(tiers.flatMap(t => POOL[t]));
function distract(word, key, n = 3) {
  const pool = POOL[word.tier].filter(w => w.en !== word.en && w[key] !== word[key]); const out = [];
  while (out.length < n && pool.length) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  return out;
}
function makeMC(def) {
  const w = pickWord(def.tiers), kind = pick(['en2ja', 'ja2en', canSpeak ? 'listen' : 'en2ja']);
  const key = kind !== 'ja2en' ? 'ja' : 'en';
  const choices = [w, ...distract(w, key)].sort(() => Math.random() - .5);
  return { w, kind, key, choices: choices.map(c => c[key]), ans: choices.indexOf(w) };
}
function makeBossQ() {
  const w = pick(POOL[4]), toJa = Math.random() < .55, key = toJa ? 'ja' : 'en';
  const pool = POOL[4].filter(x => x.en !== w.en); const ds = []; while (ds.length < 3) ds.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  const choices = [w, ...ds].sort(() => Math.random() - .5);
  return { w, kind: toJa ? (canSpeak && Math.random() < .4 ? 'listen' : 'en2ja') : 'ja2en', key, choices: choices.map(c => c[key]), ans: choices.indexOf(w) };
}
function timerLoop(t0, seconds, fin) {
  return setInterval(() => { const p = 1 - (performance.now() - t0) / (seconds * 1000); const b = $('#tbar'); if (b) { b.style.width = Math.max(0, p * 100) + '%'; b.style.background = p < .3 ? '#f44' : p < .6 ? '#fd4' : '#4f4'; } if (p <= 0) fin(); }, 80);
}
function askMC(q, seconds) {
  return new Promise(res => {
    const w = q.w, t0 = performance.now(); let done = false;
    const head = q.kind === 'en2ja' ? `<div class="sub">この えいごの いみは?</div><div class="big">${esc(w.en)}</div>` :
      q.kind === 'ja2en' ? `<div class="sub">この いみの えいごは?</div><div class="big">${esc(w.ja)}</div>` :
        `<div class="sub">きこえた えいごの いみは?</div><div class="big">♪ ???</div>`;
    msgEl.style.display = ''; typingFinish = null; advanceFn = null;
    msgEl.innerHTML = `<div class="bar"><i id="tbar"></i></div><div style="margin-top:.6em">${head}${canSpeak && q.kind !== 'ja2en' ? '<button class="spk" id="spk">🔊 きく</button>' : ''}</div>`;
    const sp = $('#spk'); if (sp) sp.onclick = () => speak(w.en);
    if (q.kind === 'listen') speak(w.en);
    cmdEl.style.display = ''; cmdEl.innerHTML = ''; cmdEl.style.gridTemplateColumns = 'repeat(2,1fr)';
    const fin = idx => { if (done) return; done = true; clearInterval(iv); cmdEl.innerHTML = ''; res({ idx, ms: performance.now() - t0 }); };
    const iv = timerLoop(t0, seconds, () => fin(-1));
    q.choices.forEach((c, i) => { const b = document.createElement('button'); b.className = 'btn'; b.textContent = c; b.onclick = () => fin(i); cmdEl.appendChild(b); });
  });
}
function askSpell(def, seconds) {
  const cands = def.tiers.filter(t => t < 4).flatMap(t => POOL[t]).filter(w => w.en.length >= 3 && w.en.length <= 9 && !/\s/.test(w.en));
  const w = roulette(cands);
  return new Promise(res => {
    const t0 = performance.now(); let done = false; const hint = w.en[0] + ' ' + [...w.en.slice(1)].map(() => '_').join(' ');
    msgEl.style.display = ''; typingFinish = null; advanceFn = null;
    msgEl.innerHTML = `<div class="bar"><i id="tbar"></i></div><div style="margin-top:.6em"><div class="sub">スペルを うちこめ!(まほう)</div><div class="big">${esc(w.ja)}</div><div class="sub">ヒント: ${hint}</div></div>`;
    cmdEl.style.display = ''; cmdEl.innerHTML = ''; cmdEl.style.gridTemplateColumns = '1fr 1fr';
    const inp = document.createElement('input'); inp.className = 'sp'; inp.autocomplete = 'off'; inp.autocapitalize = 'none'; inp.spellcheck = false; inp.placeholder = 'type here';
    const ok = document.createElement('button'); ok.className = 'btn'; ok.textContent = 'となえる!'; ok.style.gridColumn = '1/-1';
    cmdEl.append(inp, ok); setTimeout(() => inp.focus(), 50);
    const fin = ans => { if (done) return; done = true; clearInterval(iv); cmdEl.innerHTML = ''; res({ w, ok: ans != null && ans.trim().toLowerCase() === w.en.toLowerCase(), ms: performance.now() - t0 }); };
    const iv = timerLoop(t0, seconds, () => fin(inp.value || null));
    ok.onclick = () => fin(inp.value); inp.onkeydown = e => { if (e.key === 'Enter') fin(inp.value); };
  });
}

function floatText(text, x, y, color = '#fff') { B.floats.push({ text, x, y, t: 0, color }); }
function burst(x, y, color, n = 16) { for (let i = 0; i < n; i++) B.parts.push({ x, y, vx: rnd(-50, 50), vy: rnd(-80, -10), life: rnd(.4, .8), t: 0, color }); }
async function battle(def, zone) {
  mode = 'trans'; bgm(null); sfx('enc');
  await tween(350, p => TR.white = Math.sin(p * Math.PI * 3) > 0 ? 1 : 0); TR.white = 0;
  await tween(500, p => TR.p = p);
  const e = { def, hp: def.hp, max: def.hp, alpha: 1, ox: 0, oy: 0, bob: 0 };
  B = { e, zone: def.boss ? 3 : zone, floats: [], parts: [], fx: null, combo: 0 };
  mode = 'battle'; setUI('battle'); bgm(def.boss ? 'boss' : 'battle');
  await tween(500, p => TR.p = 1 - p); TR.p = 0;
  await say(def.boss ? `${def.name}が ゆくてを ふさぐ!\n「ことばの ちからを みせてみよ!」` : `${def.name}が あらわれた!`);
  let result = null; const timeLimit = def.boss ? 16 : 14;
  while (!result) {
    const c = await choose(['⚔ たたかう', '🔥 まほう (MP3)', `🌿 やくそう ×${S.herbs}`, def.boss ? '— にげられない —' : '🏃 にげる'], { cols: 2, dis: [0, S.mp < 3, S.herbs < 1 || S.hp >= maxHpOf(S.lv), !!def.boss] });
    if (c === 0 || c === 1) {
      let ok = false, ms = 0, word;
      if (c === 0) {
        const q = def.boss && Math.random() < .7 ? makeBossQ() : makeMC(def); const r = await askMC(q, timeLimit); ok = r.idx === q.ans; ms = r.ms; word = q.w;
      } else { S.mp -= 3; const r = await askSpell(def, 28); ok = r.ok; ms = r.ms; word = r.w; }
      await showResult(ok, word); rec(word.en, ok);
      if (ok) {
        B.combo++; S.best = Math.max(S.best, B.combo);
        const crit = ms < 3500 && Math.random() < .5, mult = c === 1 ? 2.6 : 1;
        let dmg = Math.round((atkOf(S.lv) + rint(0, 5)) * (1 + Math.min(B.combo - 1, 5) * .15) * mult * (crit ? 1.7 : 1));
        if (c === 1) { sfx('fire'); await fxFire(); } else { sfx(crit ? 'crit' : 'hit'); await fxSlash(); }
        dmg = Math.min(dmg, e.hp); e.hp -= dmg; floatText(String(dmg), W / 2, 60, crit ? '#ffe040' : '#fff'); burst(W / 2, 80, crit ? '#ff0' : '#fff');
        await say((crit ? 'かいしんの いちげき!!\n' : '') + `${def.name}に ${dmg}の ダメージ!` + (B.combo >= 2 ? `\n(${B.combo} コンボ!)` : ''), 400);
        if (e.hp <= 0) { result = 'win'; break; }
      } else { B.combo = 0; if (await enemyTurn()) { result = 'lose'; break; } }
    } else if (c === 2) {
      const heal = 30 + S.lv * 3; S.herbs--; const before = S.hp; S.hp = Math.min(maxHpOf(S.lv), S.hp + heal); sfx('heal');
      await say(`やくそうを つかった! HPが ${S.hp - before} かいふく!`);
      if (await enemyTurn()) { result = 'lose'; break; }
    } else if (c === 3) {
      await say('にげだした!'); if (Math.random() < .65) { result = 'run'; break; }
      await say('しかし まわりこまれてしまった!'); if (await enemyTurn()) { result = 'lose'; break; }
    }
  }
  if (result === 'win') {
    sfx('win'); await tween(600, p => { e.alpha = 1 - p; e.oy = -p * 16; }); e.alpha = 0;
    S.wins++; let ex = def.exp, gd = def.gold; if (def.boss && S.cleared) { ex = 60; gd = 60; }
    await say(`${def.name}を やっつけた!\n${ex}ポイントの けいけんち、${gd}ゴールドを かくとく!`);
    S.gold += gd; S.exp += ex; await checkLevel();
    if (def.boss && !S.cleared) { S.cleared = true; save(); await ending(); }
  } else if (result === 'lose') {
    await say('ゆうしゃは たおれてしまった…'); await say('「ことばの ちからを みがいて また ちょうせんしよう」');
    S.gold = Math.floor(S.gold / 2); S.hp = maxHpOf(S.lv); S.mp = maxMpOf(S.lv); S.x = TOWNS[0].x; S.y = TOWNS[0].y + 1; scene = { kind: 'world' };
  }
  save(); B = null;
  mode = 'trans'; await tween(400, p => TR.p = p);
  if (scene.kind === 'world') placePlayer(S.x, S.y); mode = 'field'; setUI('field'); bgm(scene.kind === 'town' ? 'town' : 'field'); await tween(400, p => TR.p = 1 - p); TR.p = 0; busy = false; lastZone = -1;
}
async function showResult(ok, w) {
  msgEl.style.display = ''; typingFinish = null;
  if (ok) { sfx('ok'); msgEl.innerHTML = `<div class="big" style="color:#8f8">⭕ せいかい!</div><div>${esc(w.en)} = ${esc(w.ja)}</div>`; }
  else { sfx('ng'); msgEl.innerHTML = `<div class="big" style="color:#f88">❌ ざんねん…</div><div>せいかいは「${esc(w.en)}」= ${esc(w.ja)}</div>`; }
  speak(w.en); await sleep(ok ? 900 : 1700);
}
async function enemyTurn() {
  const e = B.e, def = e.def;
  await say(`${def.name}の こうげき!`, 200);
  await tween(250, p => { e.oy = Math.sin(p * Math.PI) * 20; }); e.oy = 0;
  const dmg = Math.max(1, Math.round(def.atk * rnd(.8, 1.25) - S.lv * .6));
  S.hp = Math.max(0, S.hp - dmg); sfx('hurt'); shake = .4; redFlash = .35;
  await say(`ゆうしゃは ${dmg}の ダメージを うけた!`, 400);
  return S.hp <= 0;
}
async function checkLevel() {
  while (S.exp >= needOf(S.lv)) {
    S.exp -= needOf(S.lv); const oh = maxHpOf(S.lv), om = maxMpOf(S.lv); S.lv++; sfx('lvup');
    S.hp += maxHpOf(S.lv) - oh; S.mp += maxMpOf(S.lv) - om;
    await say(`ゆうしゃは レベル ${S.lv} に あがった!\nさいだいHP+${maxHpOf(S.lv) - oh}  さいだいMP+${maxMpOf(S.lv) - om}  こうげき+3`, 700);
  }
}

function drawBattle() {

function drawTitle() {

function render() {

let last = performance.now();
function loop(now) { const dt = Math.min(.05, (now - last) / 1000); last = now; update(dt); render(); requestAnimationFrame(loop); }

/* ---------------------------------------------------------------- 入力・メニュー */
const KEYS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right' };
const held = [];
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const d = KEYS[e.key]; if (d) { e.preventDefault(); if (!held.includes(d)) held.push(d); input.dir = d; }
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'z') { e.preventDefault(); if (typingFinish || advanceFn) advance(); else talk(); }
});
addEventListener('keyup', e => { const d = KEYS[e.key]; if (d) { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); input.dir = held[held.length - 1] || null; } });

document.querySelectorAll('#dpad button').forEach(b => {
  const on = e => { e.preventDefault(); ac(); input.dir = b.dataset.d; }, off = e => { e.preventDefault(); if (input.dir === b.dataset.d) input.dir = null; };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);

$('#bA').onclick = () => { if (typingFinish || advanceFn) advance(); else talk(); };

  await modal(`<h3>ゆうしゃの つよさ</h3>Lv ${S.lv}　EXP ${S.exp}/${needOf(S.lv)}<br>HP ${S.hp}/${maxHpOf(S.lv)}　MP ${S.mp}/${maxMpOf(S.lv)}<br>こうげき ${atkOf(S.lv)}　${S.gold}G　やくそう ${S.herbs}こ<br>たおした てき ${S.wins}ひき　さいこう ${S.best}コンボ<br>であった ことば ${known}こ　せいかいりつ ${tot ? Math.round(S.ok / tot * 100) : 0}%<br>${S.cleared ? '★ ワードドラゴンを たおした!' : 'もくひょう: Lv8 でドラゴンじょう(右上)へ'}`);

function titleMenu() {
