<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>がぞうメーカー - イングリッシュクエスト</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:'DotGothic16',system-ui,sans-serif;padding:12px max(12px,env(safe-area-inset-right)) 40px max(12px,env(safe-area-inset-left))}
.win{background:linear-gradient(#0a0a96,#000066);border:3px solid #f4f4f4;border-radius:8px;padding:12px;margin:0 auto 12px;max-width:560px}
h1{font-size:18px;margin:0 0 8px;font-weight:normal}
label{display:block;margin:10px 0 2px;font-size:14px}
input[type=range]{width:100%}
input[type=text],select{width:100%;font:inherit;font-size:16px;padding:8px;border:2px solid #fff;border-radius:6px;background:#000;color:#fff}
button{font:inherit;font-size:16px;color:#fff;background:linear-gradient(#1a1ab8,#000080);border:3px solid #f4f4f4;border-radius:10px;padding:10px 14px;margin:8px 8px 0 0}
button:active{background:#38f}
canvas{display:block;image-rendering:pixelated;background:repeating-conic-gradient(#335 0 25%,#446 0 50%) 50%/16px 16px;max-width:100%;margin:8px auto;border:2px solid #fff}
.row{display:flex;gap:8px;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:8px;margin:6px 0}
.item canvas,.item img{width:48px;height:48px;margin:0;image-rendering:pixelated}
small{opacity:.8}
a{color:#8cf}
</style>
</head>
<body>
<div class="win">
  <h1>がぞうメーカー</h1>
  <small>じぶんで つくった イラストを てきとして ゲームに ついかできます。はいけいを きって、ゲームで つかえる がぞうに します。(「ドットにしない」を ONに すると イラストの まま)</small>
  <label for="file">がぞうを えらぶ</label>
  <input id="file" type="file" accept="image/*">
  <label>おおきさ: <span id="vSize">200</span> ドット</label>
  <input id="size" type="range" min="24" max="320" value="200">
  <label>いろの かず: <span id="vCol">16</span></label>
  <input id="col" type="range" min="4" max="32" value="16">
  <label>はいけいを きる (きょうど: <span id="vTol">40</span>)</label>
  <input id="tol" type="range" min="0" max="120" value="40">
  <label><input id="keep" type="checkbox" checked> ドットにしない (イラストの まま)</label>
  <label><input id="outline" type="checkbox"> ふちどり (ドットのとき)</label>
  <canvas id="out" width="48" height="48" style="width:288px;height:288px"></canvas>
</div>
<div class="win">
  <label for="name">なまえ</label><input id="name" type="text" value="あたらしい てき" maxlength="12">
  <label for="zone">でるばしょ</label>
  <select id="zone"><option value="0">そうげん</option><option value="1">まよいの もり</option><option value="2">やみの だいち</option></select>
  <div class="row"><button id="add">ゲームに ついか</button><button id="dl">PNGを ほぞん</button></div>
  <p><a href="./">← ゲームに もどる</a></p>
</div>
<div class="win"><h1>ついかした てき</h1><div id="list"></div></div>
<script>
const $ = s => document.querySelector(s), KEY = 'english_quest_custom_monsters';
let srcImg = null, result = null;
const ids = ['size', 'col', 'tol'];
ids.forEach(i => $('#' + i).oninput = () => { $('#v' + { size: 'Size', col: 'Col', tol: 'Tol' }[i]).textContent = $('#' + i).value; run(); });
$('#outline').onchange = run; $('#keep').onchange = () => { const k = $('#keep').checked; $('#size').value = k ? 200 : 48; $('#vSize').textContent = $('#size').value; run(); };
$('#file').onchange = e => { const f = e.target.files[0]; if (!f) return; const img = new Image(); img.onload = () => { srcImg = img; run(); }; img.src = URL.createObjectURL(f); };

function run() {
  if (!srcImg) return; const N = +$('#size').value, K = +$('#col').value, tol = +$('#tol').value;
  // 1. 縮小 (透明な正方形にフィット)。段階的に半分ずつ縮めて、なめらかに
  let cur = document.createElement('canvas'); cur.width = srcImg.naturalWidth; cur.height = srcImg.naturalHeight; cur.getContext('2d').drawImage(srcImg, 0, 0);
  const sc = Math.min(N / cur.width, N / cur.height), tw = Math.max(1, Math.round(cur.width * sc)), th = Math.max(1, Math.round(cur.height * sc));
  while (cur.width / 2 > tw * 1.5) { const c = document.createElement('canvas'); c.width = Math.ceil(cur.width / 2); c.height = Math.ceil(cur.height / 2); const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(cur, 0, 0, c.width, c.height); cur = c; }
  const sq = document.createElement('canvas'); sq.width = sq.height = N; const sg = sq.getContext('2d'); sg.imageSmoothingQuality = 'high'; sg.drawImage(cur, Math.floor((N - tw) / 2), N - th, tw, th);
  const id = sg.getImageData(0, 0, N, N), d = id.data;
  // 2. はいけい消し: ふちから 角のいろに近い ところを つなげて透明に
  const hasAlpha = (() => { for (let i = 3; i < d.length; i += 4) if (d[i] < 250 && d[i] > 0) return true; return false; })();
  const corner = []; for (const [x, y] of [[0, 0], [N - 1, 0], [0, N - 1], [N - 1, N - 1]]) { const i = (y * N + x) * 4; if (d[i + 3] > 200) corner.push([d[i], d[i + 1], d[i + 2]]); }
  if (corner.length >= 2 && tol > 0) {
    const bg = [0, 1, 2].map(c => corner.reduce((a, p) => a + p[c], 0) / corner.length), near = i => d[i + 3] > 0 && Math.hypot(d[i] - bg[0], d[i + 1] - bg[1], d[i + 2] - bg[2]) < tol;
    const seen = new Uint8Array(N * N), st = []; for (let x = 0; x < N; x++) { st.push([x, 0], [x, N - 1]); } for (let y = 0; y < N; y++) st.push([0, y], [N - 1, y]);
    while (st.length) { const [x, y] = st.pop(); if (x < 0 || y < 0 || x >= N || y >= N || seen[y * N + x]) continue; const i = (y * N + x) * 4; if (!near(i)) continue; seen[y * N + x] = 1; d[i + 3] = 0; st.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]); }
  }
  if (!$('#keep').checked) for (let i = 0; i < d.length; i += 4) d[i + 3] = d[i + 3] > 100 ? 255 : 0;
  // 3. 減色 (k-means)
  const px = []; for (let i = 0; i < d.length; i += 4) if (d[i + 3]) px.push(i);
  const keep = $('#keep').checked;
  if (px.length && !keep) {
    let cen = []; for (let k = 0; k < K; k++) { const i = px[Math.floor(k * px.length / K)]; cen.push([d[i], d[i + 1], d[i + 2]]); }
    for (let it = 0; it < 8; it++) { const sum = cen.map(() => [0, 0, 0, 0]); px.forEach(i => { let b = 0, bd = 1e9; cen.forEach((c, k) => { const dd = (c[0] - d[i]) ** 2 + (c[1] - d[i + 1]) ** 2 + (c[2] - d[i + 2]) ** 2; if (dd < bd) { bd = dd; b = k; } }); const s = sum[b]; s[0] += d[i]; s[1] += d[i + 1]; s[2] += d[i + 2]; s[3]++; }); cen = cen.map((c, k) => sum[k][3] ? [sum[k][0] / sum[k][3], sum[k][1] / sum[k][3], sum[k][2] / sum[k][3]] : c); }
    px.forEach(i => { let b = 0, bd = 1e9; cen.forEach((c, k) => { const dd = (c[0] - d[i]) ** 2 + (c[1] - d[i + 1]) ** 2 + (c[2] - d[i + 2]) ** 2; if (dd < bd) { bd = dd; b = k; } }); d[i] = cen[b][0]; d[i + 1] = cen[b][1]; d[i + 2] = cen[b][2]; });
  }
  // 4. ふちどり (となりの色を暗くした色)
  let W = N, H = N, out = new Uint8ClampedArray(d);
  if (!keep && $('#outline').checked) {
    W = N + 2; H = N + 2; out = new Uint8ClampedArray(W * H * 4);
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) { const i = (y * N + x) * 4, o = ((y + 1) * W + x + 1) * 4; out.set(d.subarray(i, i + 4), o); }
    const src = new Uint8ClampedArray(out), A = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? -1 : (src[(y * W + x) * 4 + 3] > 128 ? (y * W + x) * 4 : -1);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { if (A(x, y) >= 0) continue; const nb = [A(x - 1, y), A(x + 1, y), A(x, y - 1), A(x, y + 1)].find(v => v >= 0); if (nb === undefined) continue; const o = (y * W + x) * 4; out[o] = src[nb] * .3; out[o + 1] = src[nb + 1] * .3; out[o + 2] = src[nb + 2] * .3; out[o + 3] = 255; }
  }
  const c = $('#out'); c.width = W; c.height = H; const dw = Math.min(300, W * 6); c.style.width = dw + 'px'; c.style.height = dw * H / W + 'px';
  c.getContext('2d').putImageData(new ImageData(out, W, H), 0, 0); result = c;
}
function list() {
  let arr = []; try { arr = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { }
  $('#list').innerHTML = arr.length ? '' : '<small>まだ ありません。</small>';
  arr.forEach((m, i) => { const d = document.createElement('div'); d.className = 'item'; d.innerHTML = `<img src="${m.src}" alt=""><span>${m.name.replace(/[<>&]/g, '')}</span>`; const b = document.createElement('button'); b.textContent = 'けす'; b.style.margin = '0 0 0 auto'; b.onclick = () => { arr.splice(i, 1); localStorage.setItem(KEY, JSON.stringify(arr)); list(); }; d.appendChild(b); $('#list').appendChild(d); });
}
$('#add').onclick = () => {
  if (!result) { alert('さきに がぞうを えらんでね'); return; }
  const zone = +$('#zone').value; let arr = []; try { arr = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { }
  arr.push({ name: $('#name').value || 'あたらしい てき', zone, src: result.toDataURL('image/png'), pix: !$('#keep').checked, hp: [32, 60, 100][zone], atk: [7, 12, 19][zone], exp: [16, 30, 52][zone], gold: [9, 15, 26][zone], sc: 2 });
  try { localStorage.setItem(KEY, JSON.stringify(arr)); } catch (e) { alert('ほぞんできませんでした'); return; } list();
};
$('#dl').onclick = () => { if (!result) return; const a = document.createElement('a'); a.href = result.toDataURL('image/png'); a.download = ($('#name').value || 'monster') + '.png'; a.click(); };
list();
</script>
</body>
</html>
